name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixin-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev

      - name: Buildozer und Cython installieren
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: APK mit Buildozer bauen
        run: |
          buildozer -v android debug

      - name: Fertige APK als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: python-app-debug-apk
          path: bin/*.apk
